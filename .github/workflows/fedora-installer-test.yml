name: Test Fedora edition live installer

# Boots the latest release (or a build run's ISO) in a virtual machine, starts the installer like the desktop icon does,
# and checks that the live desktop keeps running. Screenshots and logs are uploaded.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ISO build run to test (empty = latest release)
        required: false
  push:
    branches: [main, 'claude/**']
    paths: ['fedora/test/**', '.github/workflows/fedora-installer-test.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: as-is
            prep: ''
          # v0.72 had system folders (/, /etc, /usr...) owned by user 1001, so the keyboard service could not save the layout
          - name: with-ownership-fix
            prep: >-
              find / -xdev \( -path /home -o -path /proc -o -path /run -o -path /tmp \) -prune -o -uid 1001 ! -user liveuser -print0
              | xargs -0 chown -h root:root; chown root:root /; id liveuser; ls -lnd / /etc /etc/X11/xorg.conf.d
          # Everything v0.73 changes
          - name: with-all-v0.73-fixes
            prep: >-
              find / -xdev \( -path /home -o -path /proc -o -path /run -o -path /tmp \) -prune -o -uid 1001 ! -user liveuser -print0
              | xargs -0 chown -h root:root; chown root:root /; id liveuser; ls -lnd / /etc /etc/X11/xorg.conf.d;
              printf "[org.gnome.desktop.input-sources]\nsources=[('xkb', 'us')]\n"
              > /usr/share/glib-2.0/schemas/90_faradayos-keyboard.gschema.override
              && glib-compile-schemas /usr/share/glib-2.0/schemas 2>/dev/null;
              dnf -y -q reinstall anaconda-core anaconda-webui >/dev/null || dnf -y -q upgrade anaconda-core anaconda-webui;
              ls /usr/share/locale/de/LC_MESSAGES/anaconda.mo
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils p7zip-full python3-pil
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Get ISO
        run: |
          RUN=${{ inputs.run_id }}
          mkdir iso
          if [ -n "$RUN" ]; then
            echo "Testing ISO from build run $RUN"
            gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n FaradayOS-Fedora-ISO -D iso
          else
            TAG=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
            echo "Testing release $TAG"
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.iso.part*' -D iso
            cat iso/*.iso.part* > iso/FaradayOS.iso && rm iso/*.iso.part*
          fi
          ls -l iso

      - name: Boot live ISO and start the installer
        env:
          PREP: ${{ matrix.prep }}
        run: python3 fedora/test/live-installer-test.py iso/*.iso out --mem 8192 --minutes 6 --prep "$PREP"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-test-${{ matrix.name }}
          path: |
            out/*.png
            out/*.txt
            out/*.log
            out/result.json
          if-no-files-found: ignore
