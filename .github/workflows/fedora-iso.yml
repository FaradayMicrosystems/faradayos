name: Build Fedora edition ISO

on:
  workflow_dispatch:
  push:
    branches: [main, fedora-mutable, 'claude/**', 'experimental/**']
    paths: ['fedora/**', '!fedora/README.md', '!fedora/test/**', 'profile/airootfs/**', '.github/workflows/fedora-iso.yml']

jobs:
  iso:
    name: ISO (${{ matrix.edition }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # One build per edition (fedora/editions.list), side by side
    strategy:
      fail-fast: false
      matrix:
        edition: [performance, workplace]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      - name: Build ISO
        run: ./fedora/build-iso.sh ${{ matrix.edition }}

      - name: Show package repos used
        if: always()
        run: |
          cd out-fedora 2>/dev/null || exit 0
          # Proves every kickstart repo was loaded (anaconda silently skips some repo names)
          grep -rhiE 'fedora-updates|cisco-openh264|rpmfusion|steam' --include='*.log' . | grep -iE 'repo|load|add|enabl' | sed -E 's/^[0-9:,. -]+//' | sort -u | head -40 || true

      - name: Verify ISO (branding, boot splash, NVIDIA, edition contents)
        run: ./fedora/verify-iso.sh out-fedora/FaradayOSv$(cat fedora/VERSION)-${{ matrix.edition }}.iso

      - name: Show build errors
        if: failure()
        run: |
          cd out-fedora
          grep -rh -A12 'Transaction Summary' --include='*.log' . | head -80 || true
          grep -rhiE 'error|failed|not found|No match|cannot|Problem' --include='*.log' . | grep -v 'Configuring ' | tail -80 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.edition }}
          path: out-fedora/**/*.log
          if-no-files-found: ignore

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          # FaradayOS-Fedora-ISO = performance edition (name kept for the other workflows), FaradayOS-Workplace-ISO = workplace
          name: ${{ matrix.edition == 'performance' && 'FaradayOS-Fedora-ISO' || 'FaradayOS-Workplace-ISO' }}
          path: out-fedora/FaradayOS*.iso*
          compression-level: 0
          retention-days: 7

      # A failed installer test fails the build, so a broken ISO is never published as a release
      - name: Test the live installer in a virtual machine
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils p7zip-full python3-pil
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          python3 fedora/test/live-installer-test.py out-fedora/FaradayOS*-${{ matrix.edition }}.iso installer-test --mem 8192 --minutes 6 $(cat fedora/test/desktop-args 2>/dev/null)

      - name: Upload installer test screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-test-${{ matrix.edition }}
          path: |
            installer-test/*.png
            installer-test/*.txt
            installer-test/result.json
          if-no-files-found: ignore
