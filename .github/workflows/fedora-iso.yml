name: Build Fedora edition ISO

on:
  workflow_dispatch:
  push:
    branches: [main, fedora-mutable, 'claude/**', 'shell/**']
    paths: ['fedora/**', '!fedora/README.md', '!fedora/test/**', 'profile/airootfs/**', '.github/workflows/fedora-iso.yml']

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      - name: Build ISO
        run: ./fedora/build-iso.sh

      - name: Verify ISO (branding, boot splash, NVIDIA, gaming, VR)
        run: ./fedora/verify-iso.sh

      - name: Show build errors
        if: failure()
        run: |
          cd out-fedora
          grep -rh -A12 'Transaction Summary' --include='*.log' . | head -80 || true
          grep -rhiE 'error|failed|not found|No match|cannot|Problem' --include='*.log' . | grep -v 'Configuring ' | tail -80 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out-fedora/**/*.log
          if-no-files-found: ignore

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: FaradayOS-Fedora-ISO
          path: out-fedora/FaradayOS*.iso*
          compression-level: 0
          retention-days: 7

      # A failed installer test fails the build, so a broken ISO is never published as a release
      - name: Test the live installer in a virtual machine
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils p7zip-full python3-pil
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          python3 fedora/test/live-installer-test.py out-fedora/FaradayOS*.iso installer-test --mem 8192 --minutes 6

      - name: Upload installer test screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-test
          path: |
            installer-test/*.png
            installer-test/*.txt
            installer-test/result.json
          if-no-files-found: ignore
