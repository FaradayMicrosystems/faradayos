name: Publish Fedora edition release

# Publishes the ISO from a green build on main as a GitHub Release (faster, resumable downloads).
# Release files are limited to 2 GB, so the ISO is split into parts with checksums.
on:
  workflow_run:
    workflows: [Build Fedora edition ISO]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run to publish (empty = newest green build on main)
        required: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04  # older glibc for the Builder AppImage it builds
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h .

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download both editions' ISOs from the build
        run: |
          RUN=${{ github.event.workflow_run.id || inputs.run_id }}
          [ -n "$RUN" ] || RUN=$(gh run list -R "$GITHUB_REPOSITORY" -w fedora-iso.yml -b main -s success -L 1 --json databaseId -q '.[0].databaseId')
          echo "Publishing ISOs from build run $RUN"
          echo "RUN=$RUN" >> "$GITHUB_ENV"
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n FaradayOS-Fedora-ISO -D iso
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n FaradayOS-Workplace-ISO -D iso
          ls -l iso

      - name: Split ISOs into parts
        run: |
          V=$(cat fedora/VERSION)
          cd iso
          for ED in performance workplace; do
            ISO=FaradayOSv$V-$ED.iso
            sha256sum -c "$ISO.sha256"
            split -b 1900M -d -a 1 "$ISO" "$ISO.part"
            rm "$ISO"
          done
          sha256sum *.iso.part[0-9] > SHA256SUMS-parts.txt
          ls -l

      # The FaradayOS Builder app (builder/): people download it to build the ISOs themselves
      - uses: actions/setup-go@v5
        with:
          go-version-file: builder/go.mod
          cache-dependency-path: builder/go.sum
      - name: Build the FaradayOS Builder AppImage
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
          builder/build-appimage.sh "$(cat fedora/VERSION)"
          cp builder/dist/* iso/

      - name: Publish release
        run: |
          V=$(cat fedora/VERSION); TAG=v$V; DL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG
          howto() { # edition
            ISO=FaradayOSv$V-$1.iso
            PARTS=$(ls iso/"$ISO".part[0-9] | xargs -n1 basename | tr '\n' ' ')
            echo "Fastest download (many connections at once; \`sudo dnf install aria2\` or \`sudo pacman -S aria2\`):"
            echo
            echo "\`aria2c -Z -x16 -s16 $(for p in $PARTS; do printf '%s ' "$DL/$p"; done)\`"
            echo
            echo "- Linux: \`cat $ISO.part* > $ISO\`"
            echo "- Windows (Command Prompt, in the download folder): \`copy /b $(echo $PARTS | sed 's/ *$//; s/ / + /g') $ISO\`"
            echo "- Check it (optional): \`sha256sum -c $ISO.sha256\` should print \`OK\`."
          }
          {
            echo "FaradayOS v$V (Fedora 44, Quickshell desktop). Built by [run $RUN]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN)."
            echo
            echo "## Easiest: build it yourself with the FaradayOS Builder"
            echo "Download \`FaradayOS-Builder-v$V-x86_64.AppImage\` below, make it executable (\`chmod +x FaradayOS-Builder-*.AppImage\`, or right-click > Properties > Allow executing), and open it."
            echo "Pick **Performance** or **Workplace**; the ISO lands in \`~/FaradayOS-ISOs\`. Needs any 64-bit Linux PC with podman (the app offers to install it), about 45 GB free and about 1 hour per edition."
            echo
            echo "## Or download a ready ISO"
            echo "Two editions. Download all \`.part\` files of ONE edition, then join them into one ISO."
            echo
            echo "## Performance edition: gaming, VR, engineering"
            echo "\`FaradayOSv$V-performance.iso\`: Steam, VR tools, KDE Plasma on TTY4."
            echo
            howto performance
            echo
            echo "## Workplace edition: office, CAD, design"
            echo "\`FaradayOSv$V-workplace.iso\`: lighter, no gaming or VR, with a software catalog by category (office, CAD, design, communication, PDF, development, remote access)."
            echo
            howto workplace
            echo
            echo "Then write the ISO to a USB stick (Fedora Media Writer or balenaEtcher). See fedora/README.md."
          } > notes.md
          cat notes.md
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" \
            -t "FaradayOS v$V" -F notes.md --latest iso/*
