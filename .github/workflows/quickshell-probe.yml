name: Quickshell edition package probe

# Quick check (2-5 min): resolves the kickstart's whole package list with its repos, like the ISO build does
on:
  workflow_dispatch:
  push:
    branches: ['experimental/**']
    paths: ['.github/workflows/quickshell-probe.yml', 'fedora/faradayos.ks']

jobs:
  probe:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the kickstart package list
        run: |
          set +e
          KS=fedora/faradayos.ks
          mkdir -p /tmp/repos
          # repos from the kickstart (url + repo lines)
          sed -n 's/^url --metalink=\(.*\)/fedora \1 metalink/p; s/^repo --name=\([^ ]*\) --\(metalink\|mirrorlist\|baseurl\)=\([^ ]*\)\(.*\)/\1 \3 \2\4/p' $KS |
          while read -r name url kind rest; do
            inc=$(echo "$rest" | sed -n 's/.*--includepkgs=\([^ ]*\).*/\1/p' | tr , ' ')
            printf '[%s]\nname=%s\n%s=%s\ngpgcheck=0\n%s\n' "$name" "$name" "$kind" "$url" "${inc:+includepkgs=$inc}" > /tmp/repos/$name.repo
          done
          cat /tmp/repos/*.repo
          PKGS=$(sed -n '/^%packages/,/^%end/p' $KS | grep -v '^%\|^#\|^-\|^$' | xargs)
          EXCL=$(sed -n '/^%packages/,/^%end/p' $KS | sed -n 's/^-//p' | xargs -I{} echo --exclude={} | xargs)
          dnf -y --releasever=44 --installroot=/tmp/root --use-host-config --setopt=reposdir=/tmp/repos --setopt=install_weak_deps=True \
            $EXCL install --assumeno $PKGS > /tmp/out.txt 2>&1
          grep -iE 'problem|nothing provides|conflict|requires|No match' /tmp/out.txt | head -40
          grep -E 'Transaction Summary|Total size|After this' /tmp/out.txt
          grep -E '^ *(libstdc\+\+|hyprpicker|niri|hyprland|ryoku-desktop)' /tmp/out.txt | head
          dnf -q --releasever=44 --setopt=reposdir=/tmp/repos repoquery --qf '%{name}-%{evr}.%{arch} %{repoid}\n' libstdc++ hyprpicker
