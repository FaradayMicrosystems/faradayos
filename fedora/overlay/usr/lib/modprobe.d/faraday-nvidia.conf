# FaradayOS: let the NVIDIA driver own NVIDIA cards. nouveau (the open driver) grabs the card first
# if it loads, and then the NVIDIA driver cannot. Harmless on AMD and Intel PCs.
blacklist nouveau
options nouveau modeset=0
# Needed for KDE Wayland on NVIDIA (on by default in new drivers; set so older ones match)
options nvidia-drm modeset=1 fbdev=1
