# FaradayOS Quickshell edition: the installer must create the user account.
#
# The ISO matches Anaconda's "fedora-kde" profile (os-release VARIANT_ID=kde), which hides the
# "Create account" page because Fedora KDE makes the user at first boot (plasma-setup, a graphical
# step before the KDE login screen). This edition has no graphical login screen, so that first-boot
# step never runs: without this file the installed system has no user and nobody can sign in.
#
# Files in /etc/anaconda/conf.d are read after the profile, so this list replaces the profile's.
# Shown again: "Create account" (an admin user, in the wheel group; the page will not continue
# without a user or a root password) and "Date and time" (also first-boot work in Fedora KDE).
# Still hidden: "Network" (set up Wi-Fi in the live desktop).
[User Interface]
hidden_webui_pages =
    anaconda-screen-network
hidden_spokes =
    NetworkSpoke
