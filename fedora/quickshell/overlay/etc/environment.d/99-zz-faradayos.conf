# FaradayOS Quickshell edition: values without ; or * so they survive being copied from
# `systemctl --user show-environment`, which shell-quotes them ($'wayland;xcb').
# The installer (anaconda webui-desktop) copies the session environment that way, and Qt then
# found no platform plugin named "$'wayland" and the installer window crashed.
# Read after Ryoku's 99-ryoku-session.conf, so these win.
QT_QPA_PLATFORM=wayland
GDK_BACKEND=wayland,x11
