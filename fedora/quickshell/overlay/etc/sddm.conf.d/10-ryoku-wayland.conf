# Ryoku login screen: greeter runs on Wayland (weston kiosk), same as Ryoku's own sddm/setup
[General]
DisplayServer=wayland
GreeterEnvironment=QT_QPA_PLATFORM=wayland,XCURSOR_THEME=Bibata-Modern-Ice,XCURSOR_SIZE=24,QML_XHR_ALLOW_FILE_READ=1

[Wayland]
CompositorCommand=/usr/share/ryoku/lockscreen/ryoku-greeter
SessionCommand=/usr/share/ryoku/lockscreen/ryoku-wayland-session
