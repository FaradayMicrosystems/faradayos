# FaradayOS: no "Wallpaper changed" notification. Ryogami sends one whenever it applies a wallpaper,
# including the first one at sign-in, and that early toast left an empty card ("ghost") at the top
# right. Set Ryogami's own switch off before it starts, unless the user already chose a value.
[Service]
ExecStartPre=-/usr/libexec/faraday/ryogami-quiet
