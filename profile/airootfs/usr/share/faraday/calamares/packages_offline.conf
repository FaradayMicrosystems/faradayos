---
# FaradayOS: offline install copies the live system, then installs any optional apps picked
# in the installer. Needs internet for those; skipped cleanly without it.
# Refresh databases and update the copied system first, so new apps never mix with
# older libraries (a partial upgrade), which can break Arch-based systems.
backend: pacman
skip_if_no_internet: true
update_db: true
update_system: true
