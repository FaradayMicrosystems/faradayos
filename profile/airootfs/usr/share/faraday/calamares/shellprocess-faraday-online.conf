---
# FaradayOS (online install): turn the fresh CachyOS system into FaradayOS - packages, AUR apps,
# theme and settings. Runs on the live USB against the new system (${ROOT}), after the
# installer's package and Plymouth steps and before boot images are configured.
dontChroot: true
timeout: 10800
script:
    - command: "/usr/local/bin/faraday-online-setup ${ROOT}"
      timeout: 10800
i18n:
    name: "Installing FaradayOS apps and settings"
